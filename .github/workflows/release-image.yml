name: Release Image

# Tags and releases created by the release workflow use the workflow
# GITHUB_TOKEN, and GitHub never triggers workflows from events created by that
# token. The release workflow therefore invokes this one directly through
# workflow_call. The tag push trigger only covers manually pushed tags, and
# workflow_dispatch allows backfilling an image for an existing release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_call:
    inputs:
      tag:
        description: The release tag (vX.Y.Z) to publish the image as.
        required: true
        type: string
      ref:
        description: Commit to build. Defaults to the tag.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag (vX.Y.Z) to publish the image as.
        required: true
        type: string

permissions: {}

env:
  # Keep in sync with the IMG default in the Makefile.
  IMAGE_REPO: ghcr.io/rafpe/goweb-https/server

jobs:
  build-and-push:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Mint an OIDC token so cosign can sign the image keyless (Fulcio/Rekor).
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REPO }}
          # vX.Y.Z, vX.Y and vX all move to this build, so a deployment can pin
          # as loosely or as tightly as it wants. latest tracks the most recent
          # release, which is what the README manifests reference.
          tags: |
            type=semver,pattern=v{{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern=v{{major}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Generate a per-platform SPDX SBOM and attach it to the image index
          # as an in-toto attestation. buildx fails the build if generation
          # fails, so a missing SBOM never slips through silently.
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the image (keyless)
        env:
          # Pushed image index digest from the build step. Sign BY DIGEST so the
          # signature is bound to the exact content, never a mutable tag.
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "${DIGEST}" ]; then
            echo "::error::build step produced no image digest; refusing to sign" >&2
            exit 1
          fi
          cosign sign --yes "${IMAGE_REPO}@${DIGEST}"

      - name: Summarise
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Image published"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo '```'
            printf '%s\n' "${TAGS}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
